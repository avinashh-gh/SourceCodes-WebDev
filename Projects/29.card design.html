<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CARD DESIGN 1</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
      body {
        background-color: rgba(228, 228, 228, 0.795);
        font-family: "Roboto", sans-serif;
        align-content: center;
      }
      .main {
        background-color: white;
        height: 500px;
        width: 300px;
        box-shadow: 0 0px 15px;
        margin: 5% 38.5%;
        border-radius: 15px;
        position: fixed;
      }
      .img img {
        width: 95%;
        height: 60%;
        padding: 7px;
        border-radius: 15px;
      }
      .capsules {
        font-size: 11px;
        color: rgb(104, 103, 103);
        padding: 12px;
      }
      .capsules span {
        border: 1.5px solid rgb(109, 109, 109);
        border-radius: 15px;
        padding: 4px;
        margin: 3px;
      }
      .heading {
        margin-left: 20px;
      }
      .content {
        margin: 20px;
        color: rgb(77, 75, 75);
      }
      .end {
        color: rgba(22, 108, 238, 0.897);
        padding: 1px;
        font-weight: 450;
        margin-left: 100px;
      }
      .end button {
        cursor: pointer;
        border: none;
        font-size: 15px;
        background-color: rgb(177, 230, 248);
        border-radius: 20px;
        padding: 7px;
      } 
      .end button:active{
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="img">
        <img src="MEGHALAYA.jpg" alt="" />
      </div>
      <div class="capsules">
        <span>Heaven</span>
        <span>Hillstation</span>
      </div>
      <div class="heading">
        <h2>Meghalaya</h2>
      </div>
      <div class="content">
        <p>
          Lorem ipsum, dolor sit amet consectetur adipisicing elit. Aperiam
          accusantium deleniti sapiente ea quidem provident. Lorem ipsum dolor
          sit, amet consectetur adipisicing elit ipsum dolor sit amet
        </p>
      </div>
      <div class="end">
        <button>Read More</button>
      </div>
    </div>
  </body>
</html>
