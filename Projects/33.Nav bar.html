<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV BAR</title>
    <style>
        nav ul{
            display: flex;
            list-style-type: none;
            background-color: rgba(157, 157, 212, 0.753);
            padding: 20px;
            border-radius: 50px;
        }
        nav ul li {
            color: #f5f5f5;
            padding: 10px 15px;
            margin-left: 250px;
            font-size: 20px;
        }
        nav ul li:hover{
            background-color:  #7c82df;
            color:#ffffff;
            border-radius: 50px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
        </ul>
    </nav>
</body>
</html>
