<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X inspired</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Jura:wght@300..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Tenor+Sans&display=swap");
      body {
        background-color: lightgray;
        font-family: "Poppins", sans-serif;
      }
      .container {
        background-color: #fff;
        position: relative;
        height: 250px;
        width: 300px;
        margin: 200px auto;
        border-radius: 35px;
        box-shadow: 0 0 15px;
      }
      .img img {
        height: 240px;
        width: 290px;
        margin: 5px;
        border-radius: 32px;
      }
      .text,
      .subtext {
        position: absolute;
        left: 27px;
      }
      .text {
        color: whitesmoke;
        font-weight: 400;
        font-size: 17px;
        bottom: 35px; 
      }
      .subtext {
        color: lightgrey;
        font-weight: 300;
        font-size: 13px;
        bottom: 18px; 
      }.navig{
        position: absolute;
        font-weight: 550;
        font-size: 17px;
        right: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="img">
        <img src="pexels-rpnickson-2559941.jpg" alt="" />
      </div>
      <span class="text">Dolomites,</span>
      <span class="subtext">Italy</span>
      <span class="navig">Directions</span>
    </div>
  </body>
</html>
