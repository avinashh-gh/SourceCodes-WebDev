<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gloss Effect</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Jura:wght@300..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Tenor+Sans&display=swap");
      body {
        background: url(photo_2025-07-14_14-32-34.jpg);
        background-size: cover;
        font-family: "Poppins", sans-serif;
      }
      .container {
        width: 430px;
        height: 200px;
        margin: 200px auto;
        padding: 20px;
      }
      .gloss {
        background-color: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 25px;
      }
      .heading {
        color: whitesmoke;
        font-size: 20px;
        font-weight: 400;
      }
      svg {
        width: 60px;
        color: whitesmoke;
        padding-top: 20px;
      }
      .temp {
        font-size: 50px;
        font-weight: 500;
        color: white;
      }
      .status {
        color: white;
        font-weight: 200;
        margin-left: 200px;
      }
      .footer{
        font-size: 18px;
        font-weight: 300;
        text-align: center;
        color: whitesmoke;
      }
    </style>
  </head>
  <body>
    <div class="container gloss">
      <div class="heading">
       Jhunsi Avas Vikas Colony, Allahabad
      </div>
      <svg  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"  fill="currentColor"  class="icon icon-tabler icons-tabler-filled icon-tabler-cloud"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10.04 4.305c2.195 -.667 4.615 -.224 6.36 1.176c1.386 1.108 2.188 2.686 2.252 4.34l.003 .212l.091 .003c2.3 .107 4.143 1.961 4.25 4.27l.004 .211c0 2.407 -1.885 4.372 -4.255 4.482l-.21 .005h-11.878l-.222 -.008c-2.94 -.11 -5.317 -2.399 -5.43 -5.263l-.005 -.216c0 -2.747 2.08 -5.01 4.784 -5.417l.114 -.016l.07 -.181c.663 -1.62 2.056 -2.906 3.829 -3.518l.244 -.08z" /></svg>
      <span class="temp"> 25°C </span>
      <span class="status">Cloudy</span>
      <div class="footer">See full forecast</div>
    </div>
  </body>
</html>
