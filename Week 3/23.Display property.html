<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display property</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        background-color: black;
        color: white;
      }

      .box {
        border: 2px solid rgb(238, 237, 237);
        display: inline-block; /* to make div an inline element */
        /*these three things will not come in effect until -block is added with inline*/
        width: 200px;
        padding: 45px;
        margin: 45px;
      }
        .box1 {
            /* display: none;  // to hide the first div */
            /* visibility: hidden; to hide the first div but keep its space */
        }
    </style>
  </head>
  <body>
    <div class="box box1">I am a first div.</div>
    <div class="box">I am a second div.</div>

    <span class="2box"> I am a span with a </span>
    <span class="2box"> display property. </span>
  </body>
</html>
